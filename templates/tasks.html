{% extends 'base.html' %}
{% block title %}Quản lý Công việc{% endblock %}
{% block content %}
<div class="space-y-4">
    <div class="bg-white p-4 rounded-2xl border shadow-sm">
        <form action="{{ url_for('add_task') }}" method="POST" class="flex gap-3 text-xs">
            <input type="text" name="name" placeholder="Tên công việc" required class="border p-2 rounded-lg flex-1">
            <input type="text" name="image" placeholder="URL Hình ảnh" class="border p-2 rounded-lg flex-1">
            <button type="submit" class="bg-blue-600 text-white px-4 py-2 rounded-lg font-semibold">Thêm Công việc</button>
        </form>
    </div>
    <div class="grid grid-cols-5 gap-4">
        {% for t in tasks %}
        <div class="bg-white p-4 rounded-2xl border shadow-sm flex flex-col items-center space-y-2 text-center">
            <img src="{{ t.image }}" class="w-16 h-16 object-cover rounded-xl">
            <h4 class="font-bold text-sm text-gray-800">{{ t.name }}</h4>
            <a href="{{ url_for('delete_task', index=loop.index0) }}" class="text-red-600 text-xs font-semibold">Xóa</a>
        </div>
        {% endfor %}
    </div>
</div>
{% endblock %}
