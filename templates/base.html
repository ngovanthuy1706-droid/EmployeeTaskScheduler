<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Employee Task Scheduler{% endblock %}</title>
    <!-- CDN Tailwind CSS & FontAwesome Icons -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-gray-100 min-h-screen flex">

    <!-- SIDEBAR CHÍNH -->
    <aside class="w-64 bg-slate-900 text-white min-h-screen p-5 flex flex-col justify-between shrink-0 shadow-xl">
        <div class="space-y-8">
            <!-- Logo -->
            <div class="flex items-center gap-3 px-2">
                <div class="bg-blue-600 p-2.5 rounded-xl text-white shadow-lg">
                    <i class="fa-solid fa-clipboard-list text-xl"></i>
                </div>
                <div>
                    <h1 class="font-bold text-base leading-tight">Employee</h1>
                    <p class="text-[11px] text-gray-400">Task Scheduler</p>
                </div>
            </div>

            <!-- Menu Navigation -->
            <nav class="space-y-1.5 text-xs font-medium">
                <a href="{{ url_for('dashboard') }}" 
                   class="flex items-center gap-3 px-4 py-3 rounded-xl transition {% if request.endpoint == 'dashboard' %}bg-blue-600 text-white shadow-md font-bold{% else %}text-gray-300 hover:bg-slate-800 hover:text-white{% endif %}">
                    <i class="fa-solid fa-house text-base"></i>
                    <span>Dashboard</span>
                </a>

                <a href="{{ url_for('employees') }}" 
                   class="flex items-center gap-3 px-4 py-3 rounded-xl transition {% if request.endpoint == 'employees' %}bg-blue-600 text-white shadow-md font-bold{% else %}text-gray-300 hover:bg-slate-800 hover:text-white{% endif %}">
                    <i class="fa-solid fa-users text-base"></i>
                    <span>Nhân viên</span>
                </a>

                <a href="{{ url_for('salary') }}" 
                   class="flex items-center gap-3 px-4 py-3 rounded-xl transition {% if request.endpoint == 'salary' %}bg-blue-600 text-white shadow-md font-bold{% else %}text-gray-300 hover:bg-slate-800 hover:text-white{% endif %}">
                    <i class="fa-solid fa-money-bill-wave text-base"></i>
                    <span>Bảng lương</span>
                </a>

                <!-- NÚT ĐƠN XIN NGHỈ (ĐÃ SỬA CHUẨN MENU) -->
                <a href="{{ url_for('leaves') }}" 
                   class="flex items-center gap-3 px-4 py-3 rounded-xl transition {% if request.endpoint == 'leaves' %}bg-blue-600 text-white shadow-md font-bold{% else %}text-gray-300 hover:bg-slate-800 hover:text-white{% endif %}">
                    <i class="fa-solid fa-file-signature text-base"></i>
                    <span>Đơn xin nghỉ</span>
                </a>

                <a href="{{ url_for('settings') }}" 
                   class="flex items-center gap-3 px-4 py-3 rounded-xl transition {% if request.endpoint == 'settings' %}bg-blue-600 text-white shadow-md font-bold{% else %}text-gray-300 hover:bg-slate-800 hover:text-white{% endif %}">
                    <i class="fa-solid fa-gear text-base"></i>
                    <span>Cài đặt</span>
                </a>
            </nav>
        </div>

        <!-- Nút Đăng xuất -->
        <div class="border-t border-slate-800 pt-4">
            <a href="{{ url_for('logout') }}" class="flex items-center gap-3 px-4 py-3 text-red-400 hover:bg-red-500/10 hover:text-red-300 rounded-xl transition text-xs font-semibold">
                <i class="fa-solid fa-right-from-bracket text-base"></i>
                <span>Đăng xuất</span>
            </a>
        </div>
    </aside>

    <!-- NỘI DUNG TRANG WEB -->
    <main class="flex-1 p-8 overflow-y-auto">
        {% block content %}{% endblock %}
    </main>

</body>
</html>
