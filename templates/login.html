<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8"><title>Đăng nhập</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 flex items-center justify-center min-h-screen">
    <div class="bg-white p-8 rounded-2xl shadow-2xl w-full max-w-md">
        <h2 class="text-2xl font-bold text-center text-gray-800 mb-6">Đăng Nhập System</h2>
        {% if error %}<p class="text-red-500 text-xs mb-4 text-center">{{ error }}</p>{% endif %}
        <form action="{{ url_for('login') }}" method="POST" class="space-y-4">
            <input type="text" name="username" value="admin" required class="w-full border p-2.5 rounded-lg text-sm">
            <input type="password" name="password" value="123456" required class="w-full border p-2.5 rounded-lg text-sm">
            <button type="submit" class="w-full bg-blue-600 text-white py-2.5 rounded-lg font-semibold">Đăng Nhập</button>
        </form>
    </div>
</body>
</html>
